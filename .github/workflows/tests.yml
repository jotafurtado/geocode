name: Tests

on:
  push:
    branches:
      - master
      - 2.x
      - 'release/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '^9.52'
            testbench: '^7.40'
            php: '8.0'
            stability: prefer-stable
          - laravel: '^9.52'
            testbench: '^7.40'
            php: '8.2'
            stability: prefer-stable
          - laravel: '^10.48'
            testbench: '^8.23'
            php: '8.1'
            stability: prefer-stable
          - laravel: '^10.48'
            testbench: '^8.23'
            php: '8.3'
            stability: prefer-stable
          - laravel: '^11.31'
            testbench: '^9.5'
            php: '8.2'
            stability: prefer-stable
          - laravel: '^11.31'
            testbench: '^9.5'
            php: '8.3'
            stability: prefer-stable
          - laravel: '^12.0'
            testbench: '^10.0'
            php: '8.2'
            stability: prefer-stable
          - laravel: '^12.0'
            testbench: '^10.0'
            php: '8.3'
            stability: prefer-stable
          - laravel: '^12.0'
            testbench: '^10.0'
            php: '8.4'
            stability: prefer-stable
          - laravel: '^13.25'
            testbench: '^11.0'
            php: '8.3'
            stability: prefer-stable
          - laravel: '^13.25'
            testbench: '^11.0'
            php: '8.4'
            stability: prefer-stable
          - laravel: '^13.25'
            testbench: '^11.0'
            php: '8.3'
            stability: prefer-lowest

    name: L${{ matrix.laravel }} / PHP ${{ matrix.php }} / ${{ matrix.stability }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      # --no-security-blocking: EOL Laravel still carries Packagist advisories.
      # We install those versions only to prove compatibility.
      # guzzle is required-dev so Http::fake has GuzzleHttp\Psr7\Response.
      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --no-security-blocking
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-security-blocking \
            || composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-security-blocking

      - name: Run tests
        run: vendor/bin/phpunit

      # Gate security on current Laravel + prefer-stable only.
      # prefer-lowest intentionally resolves old transitive deps with advisories.
      - name: Composer audit
        if: contains(fromJSON('["^12.0","^13.25"]'), matrix.laravel) && matrix.stability == 'prefer-stable'
        run: composer audit --no-dev

      - name: Pint
        if: matrix.php != '8.0' && matrix.php != '8.1' && matrix.stability == 'prefer-stable'
        run: vendor/bin/pint --test

  phpstan:
    runs-on: ubuntu-latest

    name: PHPStan / L^13.25 / PHP 8.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:^13.25" "orchestra/testbench:^11.0" --no-interaction --no-update --no-security-blocking
          composer update --prefer-stable --prefer-dist --no-interaction --no-security-blocking

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --error-format=github
